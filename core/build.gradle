plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    alias libs.plugins.spotless
    alias libs.plugins.lombok
    alias libs.plugins.kotlin.jvm
    alias libs.plugins.kotlin.lombok
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

kotlin {
    jvmToolchain(21)
}

apply from: "$rootDir/gradle/scripts/jars.gradle"
apply from: "$rootDir/gradle/scripts/repositories.gradle"
apply from: "$rootDir/dependencies.gradle"
apply from: "$rootDir/gradle/scripts/publishing.gradle"
apply from: "$rootDir/gradle/scripts/spotless.gradle"

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
    options.compilerArgs << '-Xmaxerrs' << '2000'
    options.compilerArgs << "-Xlint:-removal"
}

tasks.named('compileJava', JavaCompile) {
    dependsOn tasks.named('compileKotlin')
    classpath += files(layout.buildDirectory.dir('classes/kotlin/main'))
}

tasks.named('delombok') {
    dependsOn tasks.named('compileJava')
    classpath.from(layout.buildDirectory.dir('classes/kotlin/main'))
}

lombok {
    version = "1.18.46"
}

kotlinLombok {
    lombokConfigurationFile(file("$rootDir/lombok.config"))
}
